esphome:
  name: matrix-display
  friendly_name: Matrix Display
  platformio_options:
    lib_ldf_mode: deep+
    build_flags: -DUSE_ESPHOME
    lib_deps:
      - adafruit/Adafruit GFX Library
      - cw-gfx-engine=symlink:///home/andre/git/clockwise/firmware/lib/cw-gfx-engine
      - cw-commons=symlink:///home/andre/git/clockwise/firmware/lib/cw-commons

external_components:
  - source: components


clockwise:
  id: clockwise_1
  matrix_display: matrix_display
  time: sntp_time
  clockfaces:
    - name: "House"
      source: "symlink:///home/andre/git/cw-cf-house"
      needs_double_buffer: true
    - name: "Mario"
      source: "symlink:///home/andre/git/cw-cf-0x01"
      # needs_double_buffer: false (default)
    - name: "Pacman"
      source: "symlink:///home/andre/git/cw-cf-0x05"


esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

time:
  - platform: sntp
    id: sntp_time
    timezone: 'Etc/GMT+3'


globals:
  - id: cw_light_red
    type: float
    initial_value: '0.0'
  - id: cw_light_green
    type: float
    initial_value: '0.0'
  - id: cw_light_blue
    type: float
    initial_value: '0.0'

output:
  - platform: template
    id: cw_output_red
    type: float
    write_action:
      - lambda: id(cw_light_red) = state;
  - platform: template
    id: cw_output_green
    type: float
    write_action:
      - lambda: id(cw_light_green) = state;
  - platform: template
    id: cw_output_blue
    type: float
    write_action:
      - lambda: id(cw_light_blue) = state;

light:
  - platform: rgb
    name: "Matrix Color Light"
    id: matrix_light
    red: cw_output_red
    green: cw_output_green
    blue: cw_output_blue

display:
  - platform: hub75
    id: matrix_display
    board: esp32-trinity
    panel_width: 64
    panel_height: 64
    brightness: 32
    e_pin: GPIO18
    auto_clear_enabled: false
    double_buffer: true  # required; ClockwiseComponent flips only if active face needsDoubleBuffer (House)
    update_interval: 32ms
    lambda: |-
      if (id(cw_light_red) > 0.0f || id(cw_light_green) > 0.0f || id(cw_light_blue) > 0.0f) {
        it.fill(Color(
          (uint8_t)(id(cw_light_red) * 255.0f),
          (uint8_t)(id(cw_light_green) * 255.0f),
          (uint8_t)(id(cw_light_blue) * 255.0f)
        ));
      } else {
        id(clockwise_1)->draw();
      }

sensor:
  - platform: adc
    pin: GPIO35
    name: "Luminosity"
    update_interval: 30s
    unit_of_measurement: lx
    attenuation: 12db
    filters:
      - lambda: |-
          return (x / 10000.0) * 2000000.0;

number:
  - platform: template
    name: "Matrix Brightness"
    id: matrix_brightness
    min_value: 0
    max_value: 255
    step: 1
    initial_value: 32
    optimistic: true
    set_action:
      - lambda: |-
          id(matrix_display)->set_brightness((uint8_t)x);

  - platform: template
    name: "Clockface Rotation Interval"
    id: rotation_interval
    unit_of_measurement: "s"
    min_value: 10
    max_value: 3600
    step: 10
    set_action:
      then:
        - lambda: |-
            id(clockwise_1).set_rotation_interval((int)x * 1000);
    lambda: |-
      return id(clockwise_1).get_manager().intervalMs() / 1000.0;

select:
  - platform: template
    name: "Active Clockface"
    id: active_face_select
    options:
      - "Pacman"
      - "Mario"
      - "House"
    set_action:
      then:
        - lambda: |-
            if (x == "Pacman") id(clockwise_1).set_active_face(0);
            else if (x == "Mario") id(clockwise_1).set_active_face(1);
            else if (x == "House") id(clockwise_1).set_active_face(2);
    lambda: |-
      return id(clockwise_1).get_manager().activeName();

switch:
  - platform: template
    name: "Clockface Rotation"
    id: rotation_switch
    turn_on_action:
      then:
        - lambda: |-
            id(clockwise_1).set_rotation(true);
    turn_off_action:
      then:
        - lambda: |-
            id(clockwise_1).set_rotation(false);
    lambda: |-
      return id(clockwise_1).get_manager().rotationEnabled();
